name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Tag matches atlas.version and a dated changelog entry
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qF "{:version \"$v\"" fnl/atlas.fnl || { echo "fnl/atlas.fnl does not say version $v"; exit 1; }
          grep -qE "^## \[$v\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md || { echo "CHANGELOG.md has no dated section for $v"; exit 1; }

  build-macos:
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install lua openssl pkg-config luarocks libyaml

      - name: Install Lua dependencies
        run: |
          luarocks install fennel
          luarocks install lunajson
          luarocks install luasocket
          luarocks install lyaml

      - name: Build binary
        run: make binary FENNEL=fennel

      - name: Check binary is self-contained
        run: make check-binary

      - name: Check TLS verification
        run: make check-binary-tls

      - name: Stage artifact
        run: cp bin/atlas-bin atlas-macos-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-macos-${{ matrix.arch }}
          path: atlas-macos-${{ matrix.arch }}

  build-linux:
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # the Docker build also runs the tests and check-binary
      - name: Build Linux binary via Docker
        run: |
          docker buildx build --output type=local,dest=dist/ .
          cp dist/atlas atlas-linux-${{ matrix.arch }}

      - name: Check TLS verification
        run: mkdir -p bin && cp atlas-linux-${{ matrix.arch }} bin/atlas-bin && make check-binary-tls

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-linux-${{ matrix.arch }}
          path: atlas-linux-${{ matrix.arch }}

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum atlas-* > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/atlas-*'

      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v head="## [$v]" 'index($0, head) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
