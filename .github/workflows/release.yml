name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Tag matches atlas.version and a dated changelog entry
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qF "{:version \"$v\"" fnl/atlas.fnl || { echo "fnl/atlas.fnl does not say version $v"; exit 1; }
          grep -qE "^## \[$v\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md || { echo "CHANGELOG.md has no dated section for $v"; exit 1; }

  build-macos:
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: brew install lua pkg-config luarocks libyaml

      - name: Install Lua dependencies
        # into the user tree: the Intel runners' Homebrew prefix (/usr/local)
        # isn't writable
        run: |
          luarocks --local install fennel
          luarocks --local install lunajson
          luarocks --local install luasocket
          luarocks --local install lyaml
          echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"

      # Lua, libyaml, mbedTLS and libcurl from pinned sources, for macOS 12 and later
      - name: Build binary
        run: make binary FENNEL=fennel DEPS_FROM_SOURCE=1

      - name: Check binary is self-contained and runs on macOS 12
        run: make check-binary DEPS_FROM_SOURCE=1

      - name: Check TLS verification
        run: make check-binary-tls

      - name: Stage artifact
        run: cp bin/atlas-bin atlas-macos-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: atlas-macos-${{ matrix.arch }}
          path: atlas-macos-${{ matrix.arch }}

  build-linux:
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # the Docker build also runs the tests and check-binary
      - name: Build Linux binary via Docker
        run: |
          docker buildx build --output type=local,dest=dist/ .
          cp dist/atlas atlas-linux-${{ matrix.arch }}

      - name: Check TLS verification
        run: mkdir -p bin && cp atlas-linux-${{ matrix.arch }} bin/atlas-bin && make check-binary-tls

      - uses: actions/upload-artifact@v7
        with:
          name: atlas-linux-${{ matrix.arch }}
          path: atlas-linux-${{ matrix.arch }}

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum atlas-* > SHA256SUMS && cat SHA256SUMS

      # the licenses of the software the binaries contain
      - name: Third-party licenses
        run: cp THIRD-PARTY.md dist/

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/atlas-*'

      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v head="## [$v]" 'index($0, head) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md

      # releases are immutable once published: create a draft, upload every
      # file, then publish
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      # the tap's formula installs the release binaries; skipped without a
      # TAP_TOKEN secret (contents read/write on mpenet/homebrew-tap)
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN is not set: the Homebrew tap is not updated"
            exit 0
          fi
          v="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/mpenet/homebrew-tap.git" tap
          mkdir -p tap/Formula
          tools/brew-formula.sh "$v" dist/SHA256SUMS > tap/Formula/atlas.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/atlas.rb
          git commit -m "atlas $v"
          git push
