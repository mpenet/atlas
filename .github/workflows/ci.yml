name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libyaml-dev libcurl4-openssl-dev

      - name: Install dependencies
        run: make deps

      - name: Build
        run: make build

      - name: Run tests
        run: make test

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"

      - name: Build fnlfmt 0.4.0
        run: |
          git clone --depth 1 --branch 0.4.0 https://git.sr.ht/~technomancy/fnlfmt /tmp/fnlfmt
          cd /tmp/fnlfmt && LUA_PATH="./?.lua;;" make fnlfmt

      - name: Check formatting
        run: make fmt-check FNLFMT=/tmp/fnlfmt/fnlfmt

  binary:
    # Lua 5.4 tests, the static Linux binary and its self-containment check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and check in Docker
        run: docker build --target builder -t atlas-check .

  macos-binary:
    # the release build: dependencies from pinned sources, for macOS 12
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install lua pkg-config luarocks libyaml

      - name: Install Lua dependencies
        # into the user tree: the Intel runners' Homebrew prefix (/usr/local)
        # isn't writable
        run: |
          luarocks --local install fennel
          luarocks --local install lunajson
          luarocks --local install luasocket
          luarocks --local install lyaml
          echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"

      - name: Build binary
        run: make binary FENNEL=fennel DEPS_FROM_SOURCE=1

      - name: Check binary is self-contained and runs on macOS 12
        run: make check-binary DEPS_FROM_SOURCE=1
