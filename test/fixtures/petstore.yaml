openapi: 3.0.0
info:
  title: Pet Store
  version: "1.0"
servers:
  - url: https://api.example.com
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        200:
          description: ok
        "404":
          description: not found
  /pets/{petId}:
    get:
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: ok}
components:
  schemas:
    Pet:
      required: [id, name]
      properties:
        id: {type: integer}
        name: {type: string}
        tag: {type: string, nullable: true}
