arazzo: 1.0.0
info:
  title: Petstore workflows
  version: 1.0.0
sourceDescriptions:
  - name: petstore
    url: https://petstore3.swagger.io/api/v3/openapi.json
    type: openapi
workflows:
  - workflowId: first-pet
    summary: Find the first pet with a given status and fetch its details.
    inputs:
      type: object
      properties:
        status:
          type: string
          enum: [available, pending, sold]
          default: available
          description: Pet status to look for
    steps:
      - stepId: find
        operationId: findPetsByStatus
        parameters:
          - name: status
            in: query
            value: $inputs.status
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          id: $response.body#/0/id
      - stepId: fetch
        operationId: getPetById
        parameters:
          - name: petId
            in: path
            value: $steps.find.outputs.id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          pet: $response.body
    outputs:
      name: $steps.fetch.outputs.pet#/name
      status: $steps.fetch.outputs.pet#/status
